<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>Landlord HQ — Interactive Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="preconnect" href="https://i.pravatar.cc" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { DEFAULT: '#2563EB', hover: '#1D4ED8', light: '#EFF6FF' },
                        success: { DEFAULT: '#059669', light: '#ECFDF5' },
                        warning: { DEFAULT: '#D97706', light: '#FFFBEB' },
                        danger: { DEFAULT: '#DC2626', light: '#FEF2F2' },
                    },
                    borderRadius: {
                        sm: '8px',
                        DEFAULT: '12px',
                        lg: '16px',
                        xl: '20px',
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        img { background: #F1F5F9; object-fit: cover; }
        body { font-family: var(--font-family); background: linear-gradient(135deg, #CBD5E1 0%, #94A3B8 100%); min-height: 100vh; }
        #app {
            width: 430px; height: 932px;
            --gutter: 20px;
            --canvas: 390px;
            --safe-top: 47px;
            --safe-bottom: 34px;
            --nav-height: 56px;
            --screen-pb: 20px;
            --content-pad-bottom: 20px;
            --nav-clearance: calc(var(--nav-height) + var(--safe-bottom) + 12px);
            --sticky-bar-clearance: calc(76px + var(--safe-bottom));
            --stack-gap: 14px;
            --stack-gap-sm: 12px;
            --card-pad: 16px;
            --header-pt: 8px;
            --header-pb: 12px;

            /* Consistent sizing */
            --size-thumb-sm: 56px;
            --size-thumb-md: 64px;
            --size-icon-box: 36px;
            --size-list-row: 72px;
            --size-btn: 44px;
            --gap-grid: 12px;
            --radius-thumb: 12px;

            /* Radius */
            --radius-sm: 8px;
            --radius-control: 12px;
            --radius-card: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            /* Colors — official Motto palette (Electrical Certificates) */
            --color-primary: #2563EB;
            --color-primary-hover: #1D4ED8;
            --color-primary-light: #EFF6FF;
            --color-primary-soft: #DBEAFE;
            --color-success: #059669;
            --color-success-light: #ECFDF5;
            --color-warning: #D97706;
            --color-warning-light: #FFFBEB;
            --color-warning-border: #FDE68A;
            --color-danger: #DC2626;
            --color-danger-light: #FEF2F2;
            --color-indigo: #2563EB;
            --color-indigo-light: #EFF6FF;
            --color-text: #0F172A;
            --color-text-secondary: #64748B;
            --color-text-muted: #94A3B8;
            --color-text-subtle: #475569;
            --color-border: #E2E8F0;
            --color-border-light: #F1F5F9;
            --color-surface: #FFFFFF;
            --color-bg: #F8FAFC;
            --color-success-ui: #16A34A;
            --color-success-ui-light: #DCFCE7;
            --color-success-surface: #ECFDF5;
            --color-purple: #2563EB;
            --color-purple-light: #EFF6FF;
            --color-online: #22C55E;
            --color-accent: #D97706;
            --color-accent-hover: #B45309;
            --color-accent-light: #FFFBEB;

            /* Typography — standard mobile scale */
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --text-caption: 12px;
            --text-label: 12px;
            --text-body: 14px;
            --text-body-lg: 14px;
            --text-title-sm: 15px;
            --text-title: 15px;
            --text-title-lg: 18px;
            --text-display: 24px;
            --text-display-lg: 28px;
            --font-regular: 400;
            --font-medium: 500;
            --font-semibold: 600;
            --font-bold: 700;
            --font-extrabold: 800;

            /* Elevation */
            --shadow-card: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
            --shadow-sm: 0 1px 3px rgba(15,23,42,.06);

            background: var(--color-bg);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 80px rgba(15,23,42,.25), 0 0 0 1px rgba(255,255,255,.1);
            border-radius: 2px;
        }
        #app, #app button, #app input, #app select, #app textarea {
            font-family: var(--font-family);
        }
        #app.app-preauth { background: #fff; }
        .status-bar {
            height: var(--safe-top);
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 28px 8px;
            background: var(--color-bg);
            z-index: 25;
        }
        .status-time { font-size: var(--text-body); font-weight: var(--font-semibold); color: var(--color-text); letter-spacing: -0.3px; }
        .status-notch { width: 120px; height: 28px; background: #0F172A; border-radius: 20px; position: absolute; left: 50%; top: 8px; transform: translateX(-50%); }
        .status-icons { display: flex; align-items: center; gap: 5px; color: #0F172A; }
        .status-icons svg { width: 16px; height: 16px; }
        .gutter-x { padding-left: var(--gutter); padding-right: var(--gutter); box-sizing: border-box; }
        .screen-header {
            padding: var(--header-pt) var(--gutter) var(--header-pb);
            background: var(--color-bg);
            position: sticky; top: 0; z-index: 10;
            flex-shrink: 0;
        }
        .screen-content {
            padding-left: var(--gutter);
            padding-right: var(--gutter);
            padding-top: 2px;
            padding-bottom: calc(var(--safe-bottom) + var(--content-pad-bottom));
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: var(--stack-gap);
        }
        .screen-content > .form-group,
        .screen-content > .stack > .form-group { margin-bottom: 0; }
        .screen-content-sm { gap: var(--stack-gap-sm); }
        .screen-section-title {
            font-size: var(--text-title-sm); font-weight: var(--font-bold); color: var(--color-text);
            margin: 0;
        }
        .screen-section-title:not(:first-child) { margin-top: 2px; }
        .full-bleed { margin-left: calc(var(--gutter) * -1); margin-right: calc(var(--gutter) * -1); width: calc(100% + var(--gutter) * 2); }
        .stack { display: flex; flex-direction: column; gap: var(--stack-gap); }
        .stack-sm { display: flex; flex-direction: column; gap: var(--stack-gap-sm); }
        .property-hub-meta {
            padding: var(--stack-gap-sm) var(--gutter) 0;
            display: flex; align-items: flex-start; justify-content: space-between; gap: var(--stack-gap-sm);
        }
        .property-hub-actions {
            padding: var(--stack-gap-sm) var(--gutter);
            display: flex; justify-content: space-between;
        }
        .property-hub-actions--4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .property-hub-actions--4 .quick-action span {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
        }
        .tenant-detail-header {
            display: flex; align-items: center; gap: var(--stack-gap-sm);
            padding: var(--header-pt) var(--gutter) var(--header-pb);
            border-bottom: 1px solid #E2E8F0; background: #fff;
        }
        .screen-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .screen-body.with-nav { padding-bottom: 0; }
        .screen-body.with-nav .screen-content {
            padding-bottom: var(--nav-clearance);
        }
        .screen-body.no-nav { padding-bottom: 0; }
        .screen-body::-webkit-scrollbar { width: 0; }
        .card { background: var(--color-surface); border: none; border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
        .card-bordered { border: 1px solid var(--color-border); box-shadow: none; }
        .portfolio-card {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border-radius: 16px; padding: 20px; color: #fff;
            position: relative; overflow: hidden; min-height: 130px;
            box-shadow: 0 8px 24px rgba(37,99,235,.28);
        }
        .portfolio-card .view-all-btn {
            background: rgba(255,255,255,.22); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,.25); color: #fff;
            font-size: 13px; font-weight: 600; padding: 8px 18px;
            border-radius: 10px; margin-top: 12px;
        }

        /* Dashboard home */
        .dash-header { padding-bottom: 10px; }
        .dash-header-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .dash-header-top--brand { margin-bottom: 4px; }
        .dash-brand {
            display: flex; align-items: center; gap: 8px;
            flex: 1; min-width: 0; justify-content: center;
            padding: 0 8px;
        }
        .brand-mark {
            width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
            background: #2563EB; color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 2px rgba(37, 99, 235, 0.25);
        }
        .brand-mark-svg { width: 20px; height: 20px; display: block; }
        .brand-mark--dash { width: 34px; height: 34px; }
        .brand-mark--auth { width: 38px; height: 38px; background: transparent; box-shadow: none; }
        .brand-mark--auth .brand-mark-svg { width: 28px; height: 28px; }
        .dash-brand-logo {
            width: 34px; height: 34px; object-fit: contain; flex-shrink: 0;
            border-radius: 10px; background: #2563EB;
        }
        .dash-brand-text { min-width: 0; text-align: left; }
        .dash-brand-name {
            font-size: 15px; font-weight: 800; color: var(--color-text);
            letter-spacing: -0.02em; line-height: 1.15; margin: 0;
        }
        .dash-brand-tag {
            font-size: 10px; font-weight: 600; color: var(--color-text-secondary);
            margin: 1px 0 0; line-height: 1.2;
        }
        .dash-greeting-row {
            display: flex; align-items: center; gap: var(--stack-gap-sm);
        }
        .dash-avatar {
            width: 48px; height: 48px; border-radius: var(--radius-control);
            object-fit: cover; border: 2px solid var(--color-surface);
            box-shadow: var(--shadow-sm);
        }
        .dash-greeting {
            font-size: var(--text-title-lg); font-weight: var(--font-bold); color: var(--color-text);
            letter-spacing: -0.02em; line-height: 1.2; margin: 0;
        }
        .dash-date {
            font-size: var(--text-body); color: var(--color-text-secondary); font-weight: var(--font-medium);
            margin: 3px 0 0; line-height: 1.3;
        }
        .dash-hero {
            background: linear-gradient(145deg, var(--color-primary-hover) 0%, var(--color-primary) 48%, #3B82F6 100%);
            border-radius: var(--radius-card); padding: var(--card-pad); color: #fff;
            position: relative; overflow: hidden;
            box-shadow: 0 12px 32px rgba(37,99,235,.28);
        }
        .dash-hero-glow {
            position: absolute; width: 180px; height: 180px;
            border-radius: 50%; background: rgba(255,255,255,.12);
            top: -60px; right: -40px; pointer-events: none;
        }
        .dash-hero-art {
            position: absolute; right: 8px; bottom: 0;
            width: 112px; height: 96px; opacity: .85; pointer-events: none;
        }
        .dash-hero-top {
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 1;
        }
        .dash-hero-label {
            font-size: var(--text-label); font-weight: var(--font-semibold); color: rgba(255,255,255,.85);
            letter-spacing: .02em; text-transform: uppercase;
        }
        .dash-hero-link {
            font-size: var(--text-label); font-weight: var(--font-semibold); color: #fff;
            background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.22);
            padding: 6px 12px; border-radius: var(--radius-full); cursor: pointer;
        }
        .dash-hero-link:active { background: rgba(255,255,255,.28); }
        .dash-hero-amount {
            font-size: var(--text-display-lg); font-weight: var(--font-extrabold); letter-spacing: -0.03em;
            line-height: 1; margin: 10px 0 4px; position: relative; z-index: 1;
        }
        .dash-hero-sub {
            font-size: var(--text-body); color: rgba(255,255,255,.78); font-weight: var(--font-medium);
            margin: 0; position: relative; z-index: 1;
        }
        .dash-hero-stats {
            display: flex; align-items: center; margin-top: 18px;
            padding-top: 16px; border-top: 1px solid rgba(255,255,255,.18);
            position: relative; z-index: 1;
        }
        .dash-hero-stat {
            flex: 1; text-align: center; background: none; border: none;
            color: #fff; cursor: pointer; padding: 0;
        }
        .dash-hero-stat strong {
            display: block; font-size: var(--text-title); font-weight: var(--font-bold); line-height: 1.2;
        }
        .dash-hero-stat span {
            display: block; font-size: var(--text-caption); color: rgba(255,255,255,.72);
            margin-top: 2px; font-weight: var(--font-medium);
        }
        .dash-hero-divider {
            width: 1px; height: 28px; background: rgba(255,255,255,.2); flex-shrink: 0;
        }
        .dash-alert {
            display: flex; align-items: center; gap: var(--stack-gap-sm);
            width: 100%; padding: 14px var(--card-pad); text-align: left;
            background: var(--color-danger-light); border: 1px solid #FECACA;
            border-radius: var(--radius-control); cursor: pointer;
            transition: background .12s;
        }
        .dash-alert:active { background: #FEE2E2; }
        .dash-alert-icon {
            width: 40px; height: 40px; border-radius: var(--radius-control);
            background: #FEE2E2; color: var(--color-danger);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .dash-alert-body { flex: 1; min-width: 0; }
        .dash-alert-title {
            font-size: var(--text-body); font-weight: var(--font-bold); color: #991B1B; margin: 0; line-height: 1.3;
        }
        .dash-alert-desc {
            font-size: var(--text-caption); color: #B91C1C; margin: 2px 0 0; line-height: 1.35;
        }
        .dash-alert-chevron { color: var(--color-danger); flex-shrink: 0; }
        .dash-attention { margin-top: 18px; }
        .dash-attention-heading { margin: 0 0 10px 2px; }
        .dash-attention-label {
            font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase;
            letter-spacing: .04em; margin: 0 0 8px 4px;
        }
        .dash-attention-row {
            display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 12px 14px; margin-bottom: 8px; border: none; cursor: pointer; text-align: left;
            background: #fff; border-radius: 14px; box-shadow: var(--shadow-card);
        }
        .dash-attention-row:active { background: #F8FAFC; }
        .dash-attention-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .dash-attention-body { flex: 1; min-width: 0; }
        .dash-attention-title { display: block; font-size: 14px; font-weight: 700; color: #0F172A; }
        .dash-attention-sub { display: block; font-size: 12px; color: #64748B; margin-top: 2px; }
        .dash-attention-chevron { color: #CBD5E1; flex-shrink: 0; }
        .dash-hero-rent {
            display: flex; align-items: center; gap: 16px; width: 100%;
            margin-top: 14px; padding: 14px 12px 0 0; border: none; background: transparent;
            border-top: 1px solid rgba(255,255,255,.15); cursor: pointer; text-align: left;
        }
        .dash-hero-rent:active { opacity: 0.92; }
        .dash-hero-rent-chevron { color: rgba(255,255,255,.5); flex-shrink: 0; margin-left: auto; }
        .dash-hero-rent-col { flex: 1; min-width: 0; }
        .dash-hero-rent-label { display: block; font-size: 11px; color: rgba(255,255,255,.7); }
        .dash-hero-rent-val { display: block; font-size: 16px; font-weight: 700; color: #fff; margin-top: 2px; }
        .dash-hero-rent-val--green { color: #86EFAC; }
        .dash-hero-rent-val--amber { color: #FDE68A; }
        .dash-hero-rent-divider { width: 1px; height: 32px; background: rgba(255,255,255,.2); flex-shrink: 0; }
        .dash-quick {
            display: flex;
            align-items: stretch;
            background: var(--color-surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 18px 6px 16px;
            margin-top: 14px;
        }
        .dash-quick-btn {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 4px;
            min-width: 0;
        }
        .dash-quick-btn:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 8px;
            bottom: 8px;
            width: 1px;
            background: var(--color-border-light);
        }
        .dash-quick-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .12s, background .12s;
        }
        .dash-quick-icon--primary { background: #EFF6FF; color: #2563EB; }
        .dash-quick-icon--warning { background: var(--color-warning-light); color: var(--color-accent); }
        .dash-quick-icon--success { background: var(--color-success-surface); color: var(--color-success-ui); }
        .dash-quick-icon--indigo { background: var(--color-purple-light); color: var(--color-purple); }
        .dash-quick-btn:active .dash-quick-icon { transform: scale(.94); }
        .dash-quick-btn span {
            font-size: 11px;
            font-weight: var(--font-semibold);
            color: #334155;
            text-align: center;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }
        .dash-quick--compact { margin-top: 14px; }
        .dash-quick--grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
            background: transparent; box-shadow: none; padding: 0; margin-top: 0;
        }
        .dash-quick--grid .dash-quick-btn {
            background: #fff; border-radius: 14px; box-shadow: var(--shadow-card);
            padding: 14px 8px 12px;
        }
        .dash-quick--grid .dash-quick-btn::after { display: none; }
        .dash-quick--four { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

        /* Dashboard Financial Analytics Cards & Charts */
        .dash-analytics-card {
            background: #fff;
            border-radius: var(--radius-card);
            padding: var(--card-pad);
            box-shadow: var(--shadow-card);
            margin-top: 14px;
        }
        .dash-analytics-title {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 14px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .dash-chart-donut-wrapper {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .dash-donut-container {
            position: relative;
            width: 84px;
            height: 84px;
            flex-shrink: 0;
        }
        .dash-donut-svg {
            width: 84px;
            height: 84px;
            transform: rotate(-90deg);
        }
        .dash-donut-bg {
            fill: none;
            stroke: #f1f5f9;
            stroke-width: 8;
        }
        .dash-donut-segment {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }
        .dash-donut-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            line-height: 1;
        }
        .dash-donut-text span {
            display: block;
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 2px;
        }
        .dash-donut-legend {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        .dash-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            min-width: 0;
        }
        .dash-legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dash-legend-dot--collected { background: #16A34A; }
        .dash-legend-dot--pending { background: #F59E0B; }
        .dash-legend-dot--overdue { background: #EF4444; }
        .dash-legend-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dash-legend-val {
            font-weight: 700;
            color: #334155;
            margin-left: auto;
            flex-shrink: 0;
        }
        /* Full width Bar Chart Styles */
        .dash-bar-chart-wrapper {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            height: 110px;
        }
        .dash-bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            flex: 1;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .dash-bar-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
            max-width: 80px;
        }
        .dash-bar-visual-group {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 100%;
            max-height: 84px;
            position: relative;
        }
        .dash-bar {
            width: 10px;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;

        .ux-stat-value { font-size: 18px; font-weight: 700; color: var(--color-text); margin: 0; line-height: 1.1; }

        /* Subscription plans */
        .subscription-page { padding-bottom: 0; }
        .sub-current { padding: 16px; margin-bottom: 16px; background: linear-gradient(135deg, #EFF6FF 0%, #F8FAFC 100%); }
        .sub-current-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .sub-current-label { font-size: 11px; font-weight: 700; color: #2563EB; text-transform: uppercase; letter-spacing: .04em; margin: 0; }
        .sub-current-name { font-size: 20px; font-weight: 700; color: #0F172A; margin: 4px 0 0; }
        .sub-current-pill {
            font-size: 11px; font-weight: 700; color: #16A34A; background: #ECFDF5;
            padding: 4px 10px; border-radius: 999px; flex-shrink: 0;
        }
        .sub-current-meta { font-size: 13px; color: #64748B; margin: 8px 0 0; }
        .sub-plan-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .sub-plan-card {
            position: relative; padding: 16px; overflow: hidden;
            border: 1.5px solid #E2E8F0;
        }
        .sub-plan-card--current { border-color: #2563EB; box-shadow: 0 0 0 1px rgba(37,99,235,.12); }
        .sub-plan-card--popular { border-color: #BFDBFE; }
        .sub-plan-badge {
            position: absolute; top: 12px; right: 12px;
            font-size: 10px; font-weight: 700; color: #1D4ED8; background: #DBEAFE;
            padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em;
        }
        .sub-plan-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-right: 72px; }
        .sub-plan-name { font-size: 17px; font-weight: 700; color: #0F172A; margin: 0; }
        .sub-plan-tagline { font-size: 12px; color: #64748B; margin: 2px 0 0; }
        .sub-plan-price { font-size: 22px; font-weight: 800; color: #0F172A; margin: 0; line-height: 1; }
        .sub-plan-price span { font-size: 13px; font-weight: 600; color: #64748B; }
        .sub-plan-properties { font-size: 12px; font-weight: 600; color: #2563EB; margin: 10px 0 0; }
        .sub-plan-features {
            list-style: none; margin: 12px 0 0; padding: 0;
            display: flex; flex-direction: column; gap: 8px;
        }
        .sub-plan-features li {
            display: flex; align-items: flex-start; gap: 8px;
            font-size: 13px; color: #334155; line-height: 1.35;
        }
        .sub-plan-features li i { color: #22C55E; flex-shrink: 0; margin-top: 2px; }
        .sub-plan-btn {
            width: 100%; margin-top: 14px; padding: 11px 14px;
            font-size: 13px; font-weight: 600; border-radius: 12px;
            border: 1px solid #E2E8F0; background: #fff; color: #0F172A; cursor: pointer;
        }
        .sub-plan-btn:active { background: #F8FAFC; }
        .sub-plan-card--popular .sub-plan-btn:not(.sub-plan-btn--current) {
            background: #2563EB; border-color: #2563EB; color: #fff;
        }
        .sub-plan-btn--current {
            background: #F1F5F9; border-color: #E2E8F0; color: #64748B; cursor: default;
        }
        .sub-section { margin-bottom: 4px; }
        .sub-section-hint { font-size: 12px; color: #64748B; margin: -4px 0 10px; line-height: 1.45; }
        .sub-usage { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(37,99,235,.12); }
        .sub-usage-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
        .sub-usage-label { font-size: 11px; font-weight: 600; color: #64748B; }
        .sub-usage-value { font-size: 11px; font-weight: 700; color: #2563EB; }
        .sub-usage-bar { height: 6px; border-radius: 999px; background: #DBEAFE; overflow: hidden; }
        .sub-usage-fill { display: block; height: 100%; border-radius: 999px; background: #2563EB; }
        .sub-billing-card {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: none; cursor: pointer;
        }
        .sub-billing-card:active { background: #F8FAFC; }
        .sub-billing-icon {
            width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #EFF6FF; color: #2563EB;
        }
        .sub-billing-copy { flex: 1; min-width: 0; }
        .sub-billing-title { font-size: 14px; font-weight: 600; color: #0F172A; margin: 0; }
        .sub-billing-sub { font-size: 12px; color: #64748B; margin: 2px 0 0; }
        .sub-invoice-list { border: 1px solid #E2E8F0; }
        .sub-invoice-row {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 100%; padding: 12px 14px; border: none; background: transparent; text-align: left; cursor: pointer;
        }
        .sub-invoice-row:active { background: #F8FAFC; }
        .sub-invoice-row--border { border-bottom: 1px solid #F1F5F9; }
        .sub-invoice-title { font-size: 13px; font-weight: 600; color: #0F172A; margin: 0; }
        .sub-invoice-date { font-size: 11px; color: #94A3B8; margin: 2px 0 0; }
        .sub-invoice-right { text-align: right; flex-shrink: 0; }
        .sub-invoice-amount { font-size: 13px; font-weight: 700; color: #0F172A; margin: 0; }
        .sub-invoice-status { font-size: 10px; font-weight: 700; color: #16A34A; text-transform: uppercase; }
        .sub-cancel-link {
            display: block; width: 100%; margin-top: 8px; padding: 10px;
            border: none; background: transparent; font-size: 13px; font-weight: 600; color: #DC2626; cursor: pointer;
        }
        .sub-footer-note { font-size: 12px; color: #94A3B8; text-align: center; margin: 4px 0 0; }
        .sub-footer-link {
            border: none; background: transparent; padding: 0; font-size: 12px; font-weight: 600; color: #2563EB; cursor: pointer;
        }

        .form-section {
            background: var(--color-bg); border-radius: var(--radius-card);
            padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .form-section-title { font-size: 13px; font-weight: 600; color: var(--color-text-subtle); margin: 0; }
        .flat-card-title { font-size: 14px; font-weight: 600; color: var(--color-text); }
        .flat-card-meta { font-size: 12px; color: var(--color-text-secondary); margin-top: 3px; line-height: 1.4; }
        .card-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-card {
            flex: 1; min-width: calc(50% - 4px); min-height: var(--size-btn); padding: 8px 10px;
            font-size: var(--text-caption); font-weight: var(--font-semibold); border-radius: var(--radius-control);
            border: 1px solid var(--color-border); background: #fff; color: var(--color-text); cursor: pointer;
        }
        .btn-card:active { background: #F8FAFC; }
        .btn-card--accent { background: var(--color-primary-light); border-color: #BFDBFE; color: var(--color-primary); }
        .btn-link-row { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 2px 0; }
        .btn-link {
            font-size: 12px; font-weight: 600; color: var(--color-primary); background: none; border: none;
            cursor: pointer; min-height: 36px; padding: 6px 8px;
        }
        .btn-link-muted { color: var(--color-text-secondary); }
        .btn-link-sep { color: #CBD5E1; font-size: 13px; user-select: none; }
        .screen-list-header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .screen-list-header h2 { font-size: 15px; font-weight: 600; color: var(--color-text); margin: 0; }
        .screen-list-header p { font-size: 12px; color: var(--color-text-secondary); margin: 3px 0 0; }
        .screen-list-header--compact h2 { font-size: 13px; font-weight: 600; color: #64748B; }
        .screen-list-header--compact p { font-size: 11px; color: #94A3B8; margin: 2px 0 0; }
        .header-text-link {
            font-size: 12px; font-weight: 600; color: var(--color-primary); background: none; border: none;
            cursor: pointer; white-space: nowrap; min-height: 36px; padding: 6px 4px;
        }
        .btn-danger-outline {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; min-height: var(--size-btn); padding: 10px 16px;
            font-size: var(--text-body); font-weight: var(--font-semibold); color: #DC2626;
            background: #fff; border: 1px solid #FECACA; border-radius: var(--radius-control);
            cursor: pointer;
        }
        .btn-danger-outline:active { background: #FEF2F2; }
        .btn-danger-outline--inline {
            width: auto; min-height: 36px; padding: 8px 12px; font-size: 12px;
        }
        .row-icon-btn {
            width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--color-border);
            background: #fff; color: #64748B; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .row-icon-btn:active { background: #F8FAFC; }
        .row-icon-btn--danger { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
        .row-icon-btn--primary { color: #2563EB; border-color: #BFDBFE; background: #EFF6FF; }
        .row-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .detail-title-row {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
        }
        .danger-zone { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--color-border-light); }

        /* Empty state */
        .empty-state { padding: 32px 20px; text-align: center; }
        .empty-state-icon { width: 48px; height: 48px; color: #CBD5E1; margin: 0 auto; display: block; }
        .empty-state-title { font-size: 14px; font-weight: 600; color: #0F172A; margin-top: 12px; }
        .empty-state-desc { font-size: 12px; color: #64748B; margin: 6px 0 16px; line-height: 1.45; }
        /* Tenant aliases — reuse landlord dashboard tokens */
        .tnt-section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--stack-gap-sm); }
        .tnt-section-title { font-size: var(--text-title-sm); font-weight: var(--font-bold); color: var(--color-text); margin: 0; }
        .tnt-link { font-size: var(--text-label); font-weight: var(--font-semibold); color: var(--color-primary); background: none; border: none; padding: 0; cursor: pointer; }

        /* Modal / confirm */
        .modal-overlay {
            position: absolute; inset: 0; background: rgba(15,23,42,.45); z-index: 200;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .modal-sheet {
            background: #fff; border-radius: 20px 20px 0 0; padding: 24px var(--gutter) calc(var(--safe-bottom) + 20px);
            width: 100%; max-width: 430px;
        }
        .modal-title { font-size: 16px; font-weight: 600; color: #0F172A; margin: 0 0 8px; }
        .modal-body { font-size: 13px; color: #64748B; line-height: 1.45; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-danger { background: #DC2626 !important; }

        /* Loading */
        .app-loading-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 300;
            background: linear-gradient(90deg, #2563EB, #60A5FA, #2563EB);
            background-size: 200% 100%; animation: loading-bar 1s linear infinite;
        }
        @keyframes loading-bar { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Skeleton loaders */
        .skeleton-screen { padding-bottom: 8px; }
        .skel-block, .skel-bar, .skel-circle {
            background: linear-gradient(90deg, #EEF2F7 0%, #F8FAFC 45%, #EEF2F7 90%);
            background-size: 200% 100%;
            animation: skel-shimmer 1.2s ease-in-out infinite;
            border-radius: 10px;
        }
        @keyframes skel-shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        .skel-bar { height: 12px; margin-bottom: 10px; }
        .skel-bar--sm { height: 10px; margin-bottom: 8px; }
        .skel-bar--lg { height: 28px; margin-bottom: 12px; }
        .skel-circle { border-radius: 999px; flex-shrink: 0; }
        .skel-card {
            background: #fff; border-radius: 16px; padding: 16px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }
        .skel-row { display: flex; gap: 12px; align-items: center; }
        .skel-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .skel-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .skel-hero { height: 168px; border-radius: 18px; margin-bottom: 14px; }
        .skel-stat { height: 56px; border-radius: 12px; }
        .skel-list-item { height: 72px; border-radius: 14px; margin-bottom: 10px; }
        .skel-chip-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .skel-chip { width: 72px; height: 32px; border-radius: 999px; }
        .skel-donut { width: 72px; height: 72px; border-radius: 999px; }

        /* Invite wizard */
        .wizard-progress { margin-bottom: 18px; }
        .wizard-steps { display: flex; gap: 6px; margin-bottom: 8px; }
        .wizard-step {
            flex: 1; height: 4px; border-radius: 999px; background: #E2E8F0;
            transition: background 0.2s;
        }
        .wizard-step.active, .wizard-step.done { background: #2563EB; }
        .wizard-step-label { font-size: 12px; color: #64748B; font-weight: 600; }
        .wizard-actions { display: flex; gap: 10px; margin-top: 8px; }
        .invite-review-card { background: #F8FAFC; border-radius: 14px; padding: 14px; }
        .invite-review-row {
            display: flex; justify-content: space-between; gap: 12px;
            padding: 8px 0; border-bottom: 1px solid #EEF2F7; font-size: 13px;
        }
        .invite-review-row:last-child { border-bottom: none; }
        .invite-review-label { color: #64748B; }
        .invite-review-value { color: #0F172A; font-weight: 600; text-align: right; }

        /* FAQ detail */
        .faq-detail-cat {
            display: inline-block; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: #2563EB; background: #EFF6FF; padding: 4px 10px; border-radius: 999px;
            margin-bottom: 12px;
        }
        .faq-detail-q { font-size: 18px; font-weight: 700; color: #0F172A; line-height: 1.35; margin: 0 0 14px; }
        .faq-detail-a { font-size: 14px; color: #475569; line-height: 1.6; margin: 0 0 20px; }
        .faq-detail-nav { display: flex; flex-direction: column; gap: 8px; }
        .faq-detail-link {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #E2E8F0;
            background: #fff; text-align: left; cursor: pointer;
        }
        .faq-detail-link:active { background: #F8FAFC; }
        .faq-detail-link-label { font-size: 11px; color: #94A3B8; font-weight: 600; text-transform: uppercase; }
        .faq-detail-link-q { font-size: 13px; color: #0F172A; font-weight: 600; margin-top: 2px; }

        /* Offline banner */
        .app-offline-banner {
            position: absolute; top: 0; left: 0; right: 0; z-index: 250;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 16px; background: #FEF3C7; color: #92400E;
            font-size: 12px; font-weight: 600; border-bottom: 1px solid #FDE68A;
        }

        /* Property photo gallery */
        .photo-gallery-page {
            display: flex; flex-direction: column;
            min-height: calc(100% - 8px); padding-bottom: 8px;
        }
        .photo-gallery-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-grid);
        }
        .photo-gallery-card {
            position: relative; aspect-ratio: 1 / 1;
            border-radius: var(--radius-thumb); overflow: hidden;
            background: #F1F5F9; box-shadow: var(--shadow-sm);
        }
        .photo-gallery-img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .photo-gallery-menu {
            position: absolute; top: 10px; right: 10px;
            width: var(--size-icon-box); height: var(--size-icon-box); border-radius: var(--radius-full);
            border: none; background: rgba(255, 255, 255, 0.92);
            color: #475569; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-sm); cursor: pointer;
        }
        .photo-gallery-menu:active { transform: scale(0.96); }
        .photo-gallery-footer { margin-top: auto; padding-top: 20px; }
        .photo-gallery-hint { font-size: 11px; color: #94A3B8; text-align: center; margin: 8px 0 0; }
        .photo-preview-strip {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .photo-preview-item {
            position: relative; width: 88px; height: 88px; border-radius: 12px; overflow: hidden;
            flex-shrink: 0; border: 1px solid #E2E8F0; background: #F8FAFC;
        }
        .photo-preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-preview-remove {
            position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 999px;
            border: none; background: rgba(15,23,42,.72); color: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .field-photo-upload {
            display: flex; flex-direction: column; gap: 8px;
            margin-top: 4px; margin-bottom: 2px;
        }
        .field-photo-upload .form-label { margin-bottom: 0; }
        .field-photo-upload .form-helper { margin: 0; }
        .field-photo-preview {
            position: relative; width: 100%; max-width: 240px; aspect-ratio: 4 / 3;
            border-radius: 12px; overflow: hidden; border: 1px solid #E2E8F0;
            background: #F8FAFC;
        }
        .field-photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .field-photo-upload-btn,
        .field-photo-upload .flat-edit-photo-btn {
            position: static !important;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; max-width: none;
            margin: 0; padding: 14px 16px;
            border: 1px dashed #BFDBFE; border-radius: 12px;
            background: #EFF6FF; color: #2563EB;
            box-shadow: none;
            font-size: 13px; font-weight: 700; line-height: 1.2;
            cursor: pointer;
        }
        .field-photo-upload-btn:active,
        .field-photo-upload .flat-edit-photo-btn:active {
            background: #DBEAFE;
        }
        .field-photo-upload-btn i,
        .field-photo-upload .flat-edit-photo-btn i {
            width: 18px; height: 18px; flex-shrink: 0;
        }
        .photo-add-btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; min-height: var(--size-btn); font-size: var(--text-body); font-weight: var(--font-semibold);
            border-radius: var(--radius-control);
        }
        .photo-action-sheet {
            width: 100%; max-width: 390px; margin: 0 auto;
            background: #fff; border-radius: 20px 20px 0 0;
            padding: 8px 0 calc(12px + env(safe-area-inset-bottom, 0px));
            position: absolute; left: 0; right: 0; bottom: 0;
        }
        .photo-action-item {
            display: block; width: 100%; padding: 16px 20px;
            border: none; background: #fff; text-align: center;
            font-size: 15px; font-weight: 600; color: #2563EB; cursor: pointer;
        }
        .photo-action-item:active { background: #F8FAFC; }
        .photo-action-item.danger { color: #DC2626; }
        .photo-action-item.cancel {
            margin-top: 4px; border-top: 8px solid #F8FAFC;
            color: #64748B; font-weight: 500;
        }
        .photo-cover-badge {
            position: absolute; top: 10px; left: 10px; padding: 5px 10px; border-radius: 999px;
            background: rgba(15, 23, 42, 0.72); color: #fff; font-size: 10px; font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* Building info page */
        .building-info-page { display: flex; flex-direction: column; gap: 12px; }
        .building-info-page--v2 { gap: 10px; }
        .prop-overview-strip {
            display: flex; align-items: center; justify-content: space-around;
            padding: 14px 12px; margin-bottom: 2px;
        }
        .prop-overview-stat { text-align: center; min-width: 0; flex: 1; }
        .prop-overview-stat strong { display: block; font-size: 18px; font-weight: 800; color: #0F172A; line-height: 1; }
        .prop-overview-stat span { display: block; font-size: 11px; color: #64748B; margin-top: 4px; font-weight: 600; }
        .prop-overview-divider { width: 1px; height: 28px; background: #E2E8F0; flex-shrink: 0; }
        .prop-overview-links { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .prop-overview-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            border: none; background: transparent; cursor: pointer; text-align: left;
        }
        .prop-overview-link:active { background: #F8FAFC; }
        .prop-overview-link-icon {
            width: 40px; height: 40px; border-radius: 12px; background: #EFF6FF; color: #2563EB;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .prop-overview-link-label { display: block; font-size: 14px; font-weight: 700; color: #0F172A; }
        .prop-overview-link-meta { display: block; font-size: 12px; color: #64748B; margin-top: 2px; }
        .flat-dt-payments-v2 { display: flex; flex-direction: column; gap: 12px; }
        .flat-pay-summary { padding: 16px; }
        .flat-pay-summary--overdue { background: #FEF2F2; border-color: #FECACA; }
        .flat-pay-summary--ok { background: #F0FDF4; border-color: #BBF7D0; }
        .flat-pay-summary-label { font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: .04em; margin: 0; }
        .flat-pay-summary-amount { font-size: 28px; font-weight: 800; color: #0F172A; margin: 6px 0 0; line-height: 1; }
        .flat-pay-summary--ok .flat-pay-summary-amount { color: #16A34A; }
        .flat-pay-summary--overdue .flat-pay-summary-amount { color: #DC2626; }

    <script src="landlord_hq_product.js?v=300"></script>
    <script>
    (function () {
        function showBootError(msg) {
            var app = document.getElementById('app');
            if (!app || app.innerHTML.trim()) return;
            app.className = 'app-preauth';
            app.innerHTML = '<div style="padding:32px 24px;font-family:Plus Jakarta Sans,system-ui,sans-serif;text-align:center">'
                + '<div style="width:56px;height:56px;border-radius:16px;background:#EFF6FF;color:#2563EB;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px">&#8962;</div>'
                + '<h1 style="font-size:20px;font-weight:700;color:#0F172A;margin:0 0 8px">Landlord HQ</h1>'
                + '<p style="font-size:14px;color:#64748B;line-height:1.5;margin:0 0 20px">' + msg + '</p>'
                + '<button type="button" onclick="location.reload()" style="background:#2563EB;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer">Reload app</button>'
                + '</div>';
        }
        window.addEventListener('error', function (e) {
            if (e.target && e.target.tagName === 'SCRIPT') {
                showBootError('A required file failed to load. Please refresh the page.');
            }
        }, true);
        setTimeout(function () {
            if (!document.getElementById('app') || !document.getElementById('app').innerHTML.trim()) {
                showBootError('The app is taking longer than expected to start. Please refresh or clear site data.');
            }
        }, 5000);
    })();
    </script>
</body>
