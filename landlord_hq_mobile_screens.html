<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>Landlord HQ — Interactive Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="preconnect" href="https://i.pravatar.cc" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        primary: { DEFAULT: '#2563EB', hover: '#1D4ED8', light: '#EFF6FF' },
                        success: { DEFAULT: '#059669', light: '#ECFDF5' },
                        warning: { DEFAULT: '#D97706', light: '#FFFBEB' },
                        danger: { DEFAULT: '#DC2626', light: '#FEF2F2' },
                    },
                    borderRadius: {
                        sm: '8px',
                        DEFAULT: '12px',
                        lg: '16px',
                        xl: '20px',
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        img { background: #F1F5F9; object-fit: cover; }
        body { font-family: var(--font-family); background: linear-gradient(135deg, #CBD5E1 0%, #94A3B8 100%); min-height: 100vh; }
        #app {
            width: 430px; height: 932px;
            --gutter: 20px;
            --canvas: 390px;
            --safe-top: 47px;
            --safe-bottom: 34px;
            --nav-height: 56px;
            --screen-pb: 24px;
            --stack-gap: 16px;
            --stack-gap-sm: 12px;
            --card-pad: 16px;
            --header-pt: 8px;
            --header-pb: 12px;

            /* Consistent sizing */
            --size-thumb-sm: 56px;
            --size-thumb-md: 64px;
            --size-icon-box: 36px;
            --size-list-row: 72px;
            --size-btn: 44px;
            --gap-grid: 12px;
            --radius-thumb: 12px;

            /* Radius */
            --radius-sm: 8px;
            --radius-control: 12px;
            --radius-card: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            /* Colors */
            --color-primary: #2563EB;
            --color-primary-hover: #1D4ED8;
            --color-primary-light: #EFF6FF;
            --color-success: #059669;
            --color-success-light: #ECFDF5;
            --color-warning: #D97706;
            --color-warning-light: #FFFBEB;
            --color-danger: #DC2626;
            --color-danger-light: #FEF2F2;
            --color-indigo: #4F46E5;
            --color-indigo-light: #EEF2FF;
            --color-text: #0F172A;
            --color-text-secondary: #64748B;
            --color-text-muted: #94A3B8;
            --color-text-subtle: #475569;
            --color-border: #E2E8F0;
            --color-border-light: #F1F5F9;
            --color-surface: #FFFFFF;
            --color-bg: #F8FAFC;
            --color-success-ui: #16A34A;
            --color-success-ui-light: #DCFCE7;
            --color-success-surface: #ECFDF5;
            --color-purple: #7C3AED;
            --color-purple-light: #F3E8FF;
            --color-online: #22C55E;
            --color-accent: #EA580C;

            /* Typography — standard mobile scale */
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --text-caption: 12px;
            --text-label: 12px;
            --text-body: 14px;
            --text-body-lg: 14px;
            --text-title-sm: 15px;
            --text-title: 15px;
            --text-title-lg: 17px;
            --text-display: 24px;
            --text-display-lg: 28px;
            --font-regular: 400;
            --font-medium: 500;
            --font-semibold: 600;
            --font-bold: 700;
            --font-extrabold: 800;

            /* Elevation */
            --shadow-card: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
            --shadow-sm: 0 1px 3px rgba(15,23,42,.06);

            background: var(--color-bg);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 80px rgba(15,23,42,.25), 0 0 0 1px rgba(255,255,255,.1);
            border-radius: 2px;
        }
        #app, #app button, #app input, #app select, #app textarea {
            font-family: var(--font-family);
        }
        #app.app-preauth { background: #fff; }
        .status-bar {
            height: var(--safe-top);
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 28px 8px;
            background: var(--color-bg);
            z-index: 25;
        }
        .status-time { font-size: var(--text-body); font-weight: var(--font-semibold); color: var(--color-text); letter-spacing: -0.3px; }
        .status-notch { width: 120px; height: 28px; background: #0F172A; border-radius: 20px; position: absolute; left: 50%; top: 8px; transform: translateX(-50%); }
        .status-icons { display: flex; align-items: center; gap: 5px; color: #0F172A; }
        .status-icons svg { width: 16px; height: 16px; }
        .gutter-x { padding-left: var(--gutter); padding-right: var(--gutter); box-sizing: border-box; }
        .screen-header {
            padding: var(--header-pt) var(--gutter) var(--header-pb);
            background: var(--color-bg);
            position: sticky; top: 0; z-index: 10;
            flex-shrink: 0;
        }
        .screen-content {
            padding-left: var(--gutter);
            padding-right: var(--gutter);
            padding-bottom: var(--screen-pb);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: var(--stack-gap);
        }
        .screen-content-sm { gap: var(--stack-gap-sm); }
        .screen-section-title {
            font-size: var(--text-title-sm); font-weight: var(--font-bold); color: var(--color-text);
            margin: 0;
        }
        .full-bleed { margin-left: calc(var(--gutter) * -1); margin-right: calc(var(--gutter) * -1); width: calc(100% + var(--gutter) * 2); }
        .stack { display: flex; flex-direction: column; gap: var(--stack-gap); }
        .stack-sm { display: flex; flex-direction: column; gap: var(--stack-gap-sm); }
        .property-hub-meta {
            padding: var(--stack-gap-sm) var(--gutter) 0;
            display: flex; align-items: flex-start; justify-content: space-between; gap: var(--stack-gap-sm);
        }
        .property-hub-actions {
            padding: var(--stack-gap-sm) var(--gutter);
            display: flex; justify-content: space-between;
        }
        .property-hub-actions--4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .property-hub-actions--4 .quick-action span {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
        }
        .tenant-detail-header {
            display: flex; align-items: center; gap: var(--stack-gap-sm);
            padding: var(--header-pt) var(--gutter) var(--header-pb);
            border-bottom: 1px solid #E2E8F0; background: #fff;
        }
        .screen-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .screen-body.with-nav { padding-bottom: 0; }
        .screen-body.with-nav .screen-content {
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 80px);
        }
        .screen-body.no-nav { padding-bottom: var(--safe-bottom); }
        .screen-body::-webkit-scrollbar { width: 0; }
        .card { background: var(--color-surface); border: none; border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
        .card-bordered { border: 1px solid var(--color-border); box-shadow: none; }
        .portfolio-card {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border-radius: 16px; padding: 20px; color: #fff;
            position: relative; overflow: hidden; min-height: 130px;
            box-shadow: 0 8px 24px rgba(37,99,235,.28);
        }
        .portfolio-card .view-all-btn {
            background: rgba(255,255,255,.22); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,.25); color: #fff;
            font-size: 13px; font-weight: 600; padding: 8px 18px;
            border-radius: 10px; margin-top: 12px;
        }

        /* Dashboard home */
        .dash-header { padding-bottom: 10px; }
        .dash-header-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .dash-greeting-row {
            display: flex; align-items: center; gap: var(--stack-gap-sm);
        }
        .dash-avatar {
            width: 48px; height: 48px; border-radius: var(--radius-control);
            object-fit: cover; border: 2px solid var(--color-surface);
            box-shadow: var(--shadow-sm);
        }
        .dash-greeting {
            font-size: var(--text-title-lg); font-weight: var(--font-bold); color: var(--color-text);
            letter-spacing: -0.02em; line-height: 1.2; margin: 0;
        }
        .dash-date {
            font-size: var(--text-body); color: var(--color-text-secondary); font-weight: var(--font-medium);
            margin: 3px 0 0; line-height: 1.3;
        }
        .dash-hero {
            background: linear-gradient(145deg, var(--color-primary-hover) 0%, var(--color-primary) 48%, #3B82F6 100%);
            border-radius: var(--radius-card); padding: var(--card-pad); color: #fff;
            position: relative; overflow: hidden;
            box-shadow: 0 12px 32px rgba(37,99,235,.28);
        }
        .dash-hero-glow {
            position: absolute; width: 180px; height: 180px;
            border-radius: 50%; background: rgba(255,255,255,.12);
            top: -60px; right: -40px; pointer-events: none;
        }
        .dash-hero-art {
            position: absolute; right: 8px; bottom: 0;
            width: 112px; height: 96px; opacity: .85; pointer-events: none;
        }
        .dash-hero-top {
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 1;
        }
        .dash-hero-label {
            font-size: var(--text-label); font-weight: var(--font-semibold); color: rgba(255,255,255,.85);
            letter-spacing: .02em; text-transform: uppercase;
        }
        .dash-hero-link {
            font-size: var(--text-label); font-weight: var(--font-semibold); color: #fff;
            background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.22);
            padding: 6px 12px; border-radius: var(--radius-full); cursor: pointer;
        }
        .dash-hero-link:active { background: rgba(255,255,255,.28); }
        .dash-hero-amount {
            font-size: var(--text-display-lg); font-weight: var(--font-extrabold); letter-spacing: -0.03em;
            line-height: 1; margin: 10px 0 4px; position: relative; z-index: 1;
        }
        .dash-hero-sub {
            font-size: var(--text-body); color: rgba(255,255,255,.78); font-weight: var(--font-medium);
            margin: 0; position: relative; z-index: 1;
        }
        .dash-hero-stats {
            display: flex; align-items: center; margin-top: 18px;
            padding-top: 16px; border-top: 1px solid rgba(255,255,255,.18);
            position: relative; z-index: 1;
        }
        .dash-hero-stat {
            flex: 1; text-align: center; background: none; border: none;
            color: #fff; cursor: pointer; padding: 0;
        }
        .dash-hero-stat strong {
            display: block; font-size: var(--text-title); font-weight: var(--font-bold); line-height: 1.2;
        }
        .dash-hero-stat span {
            display: block; font-size: var(--text-caption); color: rgba(255,255,255,.72);
            margin-top: 2px; font-weight: var(--font-medium);
        }
        .dash-hero-divider {
            width: 1px; height: 28px; background: rgba(255,255,255,.2); flex-shrink: 0;
        }
        .dash-alert {
            display: flex; align-items: center; gap: var(--stack-gap-sm);
            width: 100%; padding: 14px var(--card-pad); text-align: left;
            background: var(--color-danger-light); border: 1px solid #FECACA;
            border-radius: var(--radius-control); cursor: pointer;
            transition: background .12s;
        }
        .dash-alert:active { background: #FEE2E2; }
        .dash-alert-icon {
            width: 40px; height: 40px; border-radius: var(--radius-control);
            background: #FEE2E2; color: var(--color-danger);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .dash-alert-body { flex: 1; min-width: 0; }
        .dash-alert-title {
            font-size: var(--text-body); font-weight: var(--font-bold); color: #991B1B; margin: 0; line-height: 1.3;
        }
        .dash-alert-desc {
            font-size: var(--text-caption); color: #B91C1C; margin: 2px 0 0; line-height: 1.35;
        }
        .dash-alert-chevron { color: var(--color-danger); flex-shrink: 0; }
        .dash-quick {
            display: flex;
            align-items: stretch;
            background: var(--color-surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 18px 6px 16px;
        }
        .dash-quick-btn {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 4px;
            min-width: 0;
        }
        .dash-quick-btn:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 8px;
            bottom: 8px;
            width: 1px;
            background: var(--color-border-light);
        }
        .dash-quick-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .12s, background .12s;
        }
        .dash-quick-icon--primary { background: #EFF6FF; color: #2563EB; }
        .dash-quick-icon--warning { background: var(--color-warning-light); color: var(--color-accent); }
        .dash-quick-icon--success { background: var(--color-success-surface); color: var(--color-success-ui); }
        .dash-quick-icon--indigo { background: var(--color-purple-light); color: var(--color-purple); }
        .dash-quick-btn:active .dash-quick-icon { transform: scale(.94); }
        .dash-quick-btn span {
            font-size: 11px;
            font-weight: var(--font-semibold);
            color: #334155;
            text-align: center;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }
        .dash-section-sub {
            font-size: var(--text-label); color: var(--color-text-muted); margin: 3px 0 0; font-weight: var(--font-medium);
        }
        .dash-stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .dash-stat-grid .dash-stat { min-height: 76px; }
        .dash-stat {
            position: relative;
            padding: 11px 12px;
            border-radius: var(--radius-control);
            text-align: left;
            border: 1px solid var(--stat-border);
            cursor: pointer;
            overflow: hidden;
            display: block;
            background: linear-gradient(160deg, var(--stat-bg) 0%, var(--color-surface) 70%);
            box-shadow: 0 1px 3px var(--stat-shadow);
            transition: transform .12s;
        }
        .dash-stat:active { transform: scale(.98); }
        .dash-stat--issues {
            --stat-bg: var(--color-warning-light);
            --stat-border: rgba(234, 88, 12, 0.14);
            --stat-shadow: rgba(234, 88, 12, 0.06);
            --stat-icon-bg: rgba(234, 88, 12, 0.1);
            --stat-icon: #EA580C;
            --stat-pill-bg: #FFEDD5;
            --stat-pill-text: #C2410C;
        }
        .dash-stat--vacant {
            --stat-bg: var(--color-indigo-light);
            --stat-border: rgba(79, 70, 229, 0.14);
            --stat-shadow: rgba(79, 70, 229, 0.06);
            --stat-icon-bg: rgba(79, 70, 229, 0.1);
            --stat-icon: var(--color-indigo);
            --stat-pill-bg: #E0E7FF;
            --stat-pill-text: #4338CA;
        }
        .dash-stat--compliant {
            --stat-bg: var(--color-success-light);
            --stat-border: rgba(5, 150, 105, 0.14);
            --stat-shadow: rgba(5, 150, 105, 0.06);
            --stat-icon-bg: rgba(5, 150, 105, 0.1);
            --stat-icon: var(--color-success);
            --stat-pill-bg: #D1FAE5;
            --stat-pill-text: #047857;
        }
        .dash-stat--collected,
        .dash-stat--income {
            --stat-bg: var(--color-primary-light);
            --stat-border: rgba(37, 99, 235, 0.14);
            --stat-shadow: rgba(37, 99, 235, 0.06);
            --stat-icon-bg: rgba(37, 99, 235, 0.1);
            --stat-icon: var(--color-primary);
            --stat-pill-bg: #DBEAFE;
            --stat-pill-text: #1D4ED8;
        }
        .dash-stat-row {
            display: flex; align-items: center; gap: 10px;
        }
        .dash-stat-icon {
            width: 32px; height: 32px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            background: var(--stat-icon-bg); color: var(--stat-icon);
        }
        .dash-stat-info { flex: 1; min-width: 0; }
        .dash-stat-pill {
            font-size: var(--text-caption); font-weight: var(--font-bold); padding: 3px 6px;
            border-radius: var(--radius-full); line-height: 1; white-space: nowrap; flex-shrink: 0;
            background: var(--stat-pill-bg); color: var(--stat-pill-text);
        }
        .dash-stat-value {
            font-size: var(--text-title-lg); font-weight: var(--font-extrabold); color: var(--color-text);
            letter-spacing: -0.02em; margin: 1px 0 0; line-height: 1.1;
        }
        .dash-stat-label {
            font-size: var(--text-caption); color: var(--color-text-secondary); font-weight: var(--font-semibold);
            margin: 0; line-height: 1.2;
        }
        .dash-reminder-list { overflow: hidden; }
        .dash-reminder-row {
            display: flex; align-items: center; gap: 12px;
            width: 100%; padding: 14px 16px; text-align: left;
            background: #fff; border: none; cursor: pointer;
            border-bottom: 1px solid #F1F5F9;
            border-left: 3px solid transparent;
            transition: background .12s;
        }
        .dash-reminder-row:last-child { border-bottom: none; }
        .dash-reminder-row:active { background: var(--color-bg); }
        .dash-reminder-row.urgency-high { border-left-color: var(--color-danger); }
        .dash-reminder-row.urgency-medium { border-left-color: var(--color-warning); }
        .dash-reminder-icon {
            width: 40px; height: 40px; border-radius: var(--radius-control);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .dash-reminder-body { flex: 1; min-width: 0; }
        .dash-reminder-title {
            font-size: var(--text-body); font-weight: var(--font-semibold); color: var(--color-text); margin: 0; line-height: 1.3;
        }
        .dash-reminder-prop {
            font-size: var(--text-caption); color: var(--color-text-secondary); margin: 2px 0 0; line-height: 1.35;
        }
        .dash-view-all {
            font-size: var(--text-label); font-weight: var(--font-semibold); color: var(--color-primary);
            background: none; border: none; cursor: pointer; padding: 0; flex-shrink: 0;
        }
        .dash-section-head {
            display: flex; align-items: flex-end; justify-content: space-between; gap: var(--stack-gap-sm);
        }

        .stat-mini { padding: 14px; border-radius: 14px; }
        .stat-mini .stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .segment-toggle { background: var(--color-border); border-radius: var(--radius-sm); padding: 3px; display: grid; grid-template-columns: 1fr 1fr; }
        .segment-toggle button { text-align: center; padding: 8px; font-size: var(--text-label); font-weight: var(--font-semibold); border-radius: var(--radius-sm); color: var(--color-text-secondary); cursor: pointer; border: none; background: transparent; width: 100%; }
        .segment-toggle button.active { background: var(--color-surface); color: var(--color-primary); box-shadow: var(--shadow-sm); }
        .filter-btn {
            width: 44px; height: 44px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-control);
            color: var(--color-text-secondary); cursor: pointer; position: relative;
            box-shadow: var(--shadow-sm);
        }
        .filter-btn:active { background: var(--color-bg); }
        .filter-btn-active { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-light); }
        .filter-chip { padding: 8px 16px; border-radius: var(--radius-full); font-size: var(--text-label); font-weight: var(--font-semibold); white-space: nowrap; cursor: pointer; border: none; }
        .filter-chip.active { background: var(--color-primary); color: #fff; }
        .filter-chip:not(.active) { background: var(--color-border); color: var(--color-text-secondary); }
        .filter-panel { animation: fadeSlide .25s ease; }
        .filter-btn-dot {
            position: absolute; top: 8px; right: 8px;
            width: 7px; height: 7px; background: #2563EB; border-radius: 50%;
            border: 1.5px solid #EFF6FF;
        }

        /* Filter bottom sheet */
        .filter-sheet-overlay {
            position: absolute; inset: 0;
            background: rgba(15,23,42,.4);
            z-index: 45; opacity: 0; pointer-events: none;
            transition: opacity .3s;
        }
        .filter-sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .filter-sheet {
            position: absolute; left: 0; right: 0; bottom: 0;
            background: #fff; z-index: 46;
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 -8px 32px rgba(15,23,42,.1);
            padding-bottom: var(--safe-bottom);
        }
        .filter-sheet.open { transform: translateY(0); }
        .filter-sheet-handle {
            width: 36px; height: 4px; background: #E2E8F0;
            border-radius: 100px; margin: 10px auto 0;
        }
        .filter-sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: var(--stack-gap-sm) var(--gutter) var(--stack-gap-sm);
        }
        .filter-sheet-title { font-size: 15px; font-weight: 600; color: #0F172A; }
        .filter-sheet-reset {

        .ux-stat {
            background: #fff; border-radius: var(--radius-card); padding: 14px;
            box-shadow: var(--shadow-card);
        }
        .ux-stat-label { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); margin: 0 0 4px; }
        .ux-stat-value { font-size: 18px; font-weight: 700; color: var(--color-text); margin: 0; line-height: 1.1; }
        .form-section {
            background: var(--color-bg); border-radius: var(--radius-card);
            padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .form-section-title { font-size: 13px; font-weight: 600; color: var(--color-text-subtle); margin: 0; }
        .flat-card-title { font-size: 14px; font-weight: 600; color: var(--color-text); }
        .flat-card-meta { font-size: 12px; color: var(--color-text-secondary); margin-top: 3px; line-height: 1.4; }
        .card-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-card {
            flex: 1; min-width: calc(50% - 4px); min-height: var(--size-btn); padding: 8px 10px;
            font-size: var(--text-caption); font-weight: var(--font-semibold); border-radius: var(--radius-control);
            border: 1px solid var(--color-border); background: #fff; color: var(--color-text); cursor: pointer;
        }
        .btn-card:active { background: #F8FAFC; }
        .btn-card--accent { background: var(--color-primary-light); border-color: #BFDBFE; color: var(--color-primary); }
        .btn-link-row { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 2px 0; }
        .btn-link {
            font-size: 12px; font-weight: 600; color: var(--color-primary); background: none; border: none;
            cursor: pointer; min-height: 36px; padding: 6px 8px;
        }
        .btn-link-muted { color: var(--color-text-secondary); }
        .btn-link-sep { color: #CBD5E1; font-size: 13px; user-select: none; }
        .screen-list-header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .screen-list-header h2 { font-size: 15px; font-weight: 600; color: var(--color-text); margin: 0; }
        .screen-list-header p { font-size: 12px; color: var(--color-text-secondary); margin: 3px 0 0; }
        .header-text-link {
            font-size: 12px; font-weight: 600; color: var(--color-primary); background: none; border: none;
            cursor: pointer; white-space: nowrap; min-height: 36px; padding: 6px 4px;
        }
        .btn-danger-outline {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; min-height: var(--size-btn); padding: 10px 16px;
            font-size: var(--text-body); font-weight: var(--font-semibold); color: #DC2626;
            background: #fff; border: 1px solid #FECACA; border-radius: var(--radius-control);
            cursor: pointer;
        }
        .btn-danger-outline:active { background: #FEF2F2; }
        .btn-danger-outline--inline {
            width: auto; min-height: 36px; padding: 8px 12px; font-size: 12px;
        }
        .row-icon-btn {
            width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--color-border);
            background: #fff; color: #64748B; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .row-icon-btn:active { background: #F8FAFC; }
        .row-icon-btn--danger { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
        .row-icon-btn--primary { color: #2563EB; border-color: #BFDBFE; background: #EFF6FF; }
        .row-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .detail-title-row {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
        }
        .danger-zone { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--color-border-light); }

        /* Empty state */
        .empty-state { padding: 32px 20px; text-align: center; }
        .empty-state-title { font-size: 14px; font-weight: 600; color: #0F172A; margin-top: 12px; }
        .empty-state-desc { font-size: 12px; color: #64748B; margin: 6px 0 16px; line-height: 1.45; }

        /* Modal / confirm */
        .modal-overlay {
            position: absolute; inset: 0; background: rgba(15,23,42,.45); z-index: 200;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .modal-sheet {
            background: #fff; border-radius: 20px 20px 0 0; padding: 24px var(--gutter) calc(var(--safe-bottom) + 20px);
            width: 100%; max-width: 430px;
        }
        .modal-title { font-size: 16px; font-weight: 600; color: #0F172A; margin: 0 0 8px; }
        .modal-body { font-size: 13px; color: #64748B; line-height: 1.45; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-danger { background: #DC2626 !important; }

        /* Loading */
        .app-loading-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 300;
            background: linear-gradient(90deg, #2563EB, #60A5FA, #2563EB);
            background-size: 200% 100%; animation: loading-bar 1s linear infinite;
        }
        @keyframes loading-bar { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Skeleton loaders */
        .skeleton-screen { padding-bottom: 8px; }
        .skel-block, .skel-bar, .skel-circle {
            background: linear-gradient(90deg, #EEF2F7 0%, #F8FAFC 45%, #EEF2F7 90%);
            background-size: 200% 100%;
            animation: skel-shimmer 1.2s ease-in-out infinite;
            border-radius: 10px;
        }
        @keyframes skel-shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        .skel-bar { height: 12px; margin-bottom: 10px; }
        .skel-bar--sm { height: 10px; margin-bottom: 8px; }
        .skel-bar--lg { height: 28px; margin-bottom: 12px; }
        .skel-circle { border-radius: 999px; flex-shrink: 0; }
        .skel-card {
            background: #fff; border-radius: 16px; padding: 16px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }
        .skel-row { display: flex; gap: 12px; align-items: center; }
        .skel-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .skel-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .skel-hero { height: 168px; border-radius: 18px; margin-bottom: 14px; }
        .skel-stat { height: 56px; border-radius: 12px; }
        .skel-list-item { height: 72px; border-radius: 14px; margin-bottom: 10px; }
        .skel-chip-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .skel-chip { width: 72px; height: 32px; border-radius: 999px; }
        .skel-donut { width: 72px; height: 72px; border-radius: 999px; }

        /* Invite wizard */
        .wizard-progress { margin-bottom: 18px; }
        .wizard-steps { display: flex; gap: 6px; margin-bottom: 8px; }
        .wizard-step {
            flex: 1; height: 4px; border-radius: 999px; background: #E2E8F0;
            transition: background 0.2s;
        }
        .wizard-step.active, .wizard-step.done { background: #2563EB; }
        .wizard-step-label { font-size: 12px; color: #64748B; font-weight: 600; }
        .wizard-actions { display: flex; gap: 10px; margin-top: 8px; }
        .invite-review-card { background: #F8FAFC; border-radius: 14px; padding: 14px; }
        .invite-review-row {
            display: flex; justify-content: space-between; gap: 12px;
            padding: 8px 0; border-bottom: 1px solid #EEF2F7; font-size: 13px;
        }
        .invite-review-row:last-child { border-bottom: none; }
        .invite-review-label { color: #64748B; }
        .invite-review-value { color: #0F172A; font-weight: 600; text-align: right; }

        /* FAQ detail */
        .faq-detail-cat {
            display: inline-block; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
            color: #2563EB; background: #EFF6FF; padding: 4px 10px; border-radius: 999px;
            margin-bottom: 12px;
        }
        .faq-detail-q { font-size: 18px; font-weight: 700; color: #0F172A; line-height: 1.35; margin: 0 0 14px; }
        .faq-detail-a { font-size: 14px; color: #475569; line-height: 1.6; margin: 0 0 20px; }
        .faq-detail-nav { display: flex; flex-direction: column; gap: 8px; }
        .faq-detail-link {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #E2E8F0;
            background: #fff; text-align: left; cursor: pointer;
        }
        .faq-detail-link:active { background: #F8FAFC; }
        .faq-detail-link-label { font-size: 11px; color: #94A3B8; font-weight: 600; text-transform: uppercase; }
        .faq-detail-link-q { font-size: 13px; color: #0F172A; font-weight: 600; margin-top: 2px; }

        /* Offline banner */
        .app-offline-banner {
            position: absolute; top: 0; left: 0; right: 0; z-index: 250;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 16px; background: #FEF3C7; color: #92400E;
            font-size: 12px; font-weight: 600; border-bottom: 1px solid #FDE68A;
        }

        /* Property photo gallery */
        .photo-gallery-page {
            display: flex; flex-direction: column;
            min-height: calc(100% - 8px); padding-bottom: 8px;
        }
        .photo-gallery-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-grid);
        }
        .photo-gallery-card {
            position: relative; aspect-ratio: 1 / 1;
            border-radius: var(--radius-thumb); overflow: hidden;
            background: #F1F5F9; box-shadow: var(--shadow-sm);
        }
        .photo-gallery-img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .photo-gallery-menu {
            position: absolute; top: 10px; right: 10px;
            width: var(--size-icon-box); height: var(--size-icon-box); border-radius: var(--radius-full);
            border: none; background: rgba(255, 255, 255, 0.92);
            color: #475569; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-sm); cursor: pointer;
        }
        .photo-gallery-menu:active { transform: scale(0.96); }
        .photo-gallery-footer { margin-top: auto; padding-top: 20px; }
        .photo-add-btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; min-height: var(--size-btn); font-size: var(--text-body); font-weight: var(--font-semibold);
            border-radius: var(--radius-control);
        }
        .photo-action-sheet {
            width: 100%; max-width: 390px; margin: 0 auto;
            background: #fff; border-radius: 20px 20px 0 0;
            padding: 8px 0 calc(12px + env(safe-area-inset-bottom, 0px));
            position: absolute; left: 0; right: 0; bottom: 0;
        }
        .photo-action-item {
            display: block; width: 100%; padding: 16px 20px;
            border: none; background: #fff; text-align: center;
            font-size: 15px; font-weight: 600; color: #2563EB; cursor: pointer;
        }
        .photo-action-item:active { background: #F8FAFC; }
        .photo-action-item.danger { color: #DC2626; }
        .photo-action-item.cancel {
            margin-top: 4px; border-top: 8px solid #F8FAFC;
            color: #64748B; font-weight: 500;
        }
        .photo-cover-badge {
            position: absolute; top: 10px; left: 10px; padding: 5px 10px; border-radius: 999px;
            background: rgba(15, 23, 42, 0.72); color: #fff; font-size: 10px; font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* Building info page */
        .building-info-page { display: flex; flex-direction: column; gap: 12px; }
        .building-summary-card {
            padding: var(--card-pad); border: 1px solid var(--color-border);
        }
        .building-summary-card-hero {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 12px;
        }
        .building-info-hero {
            display: flex; align-items: center; gap: 10px;
            padding: 2px 0 0; min-height: 0;
        }
        .building-info-thumb {
            width: 52px; height: 52px; border-radius: 12px;
            overflow: hidden; flex-shrink: 0; background: #F1F5F9;
        }
        .building-info-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .building-info-name { font-size: 15px; font-weight: 800; color: #0F172A; line-height: 1.2; }
        .building-info-addr { font-size: 12px; color: #64748B; margin-top: 2px; line-height: 1.3; }
        .prop-hub-page .prop-building-header { margin-bottom: 4px; }
        .building-metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        .building-metric-compact {
            background: #F8FAFC; border-radius: 10px;
            padding: 10px 11px; border: 1px solid #EEF2F6;
        }
        .building-metric-compact-main {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .building-metric-compact-left {
            display: inline-flex; align-items: center; gap: 7px; min-width: 0;
        }
        .building-metric-icon {
            width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
            background: #fff; border: 1px solid var(--color-border);
            display: inline-flex; align-items: center; justify-content: center;
            color: #64748B;
        }
        .building-metric-compact-label {
            font-size: 11px; font-weight: 600; color: #64748B; line-height: 1.2;
        }
        .building-metric-compact-value {
            font-size: 16px; font-weight: 800; color: #0F172A; line-height: 1;
            flex-shrink: 0;
        }
        .building-metric-compact--accent .building-metric-compact-value { color: #2563EB; font-size: 15px; }
        .building-metric-compact--progress { padding-bottom: 9px; }
        .building-metric-compact-bar {
            height: 3px; border-radius: 999px; background: #E2E8F0;
            overflow: hidden; margin-top: 7px;
        }
        .building-metric-compact-bar span {
            display: block; height: 100%; border-radius: inherit; background: #2563EB;
        }
        .building-section { padding: var(--card-pad); }
        .building-section-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 10px; min-height: 20px;
        }
        .building-section-head h3 {
            font-size: 14px; font-weight: 800; color: #0F172A; margin: 0;
            flex: 1; min-width: 0;
        }
        .building-section-head-actions {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .building-section-menu {
            position: relative; display: flex; align-items: center;
        }
        .building-section-meta { font-size: var(--text-caption); color: #64748B; }
        .building-section-sub {
            font-size: var(--text-caption); color: #64748B; margin: -4px 0 10px; line-height: 1.4;
        }
        .building-empty-copy { font-size: var(--text-caption); color: #64748B; margin: 0 0 8px; }
        .building-photo-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-grid); margin-bottom: var(--gap-grid);
        }
        .building-photo-thumb {
            position: relative; aspect-ratio: 1 / 1; border-radius: var(--radius-thumb);
            overflow: hidden; background: #F1F5F9;
        }
        .building-photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .building-info-rows { display: flex; flex-direction: column; }
        .building-info-row {
            display: flex; align-items: center; justify-content: space-between; gap: var(--gap-grid);
            min-height: var(--size-btn); padding: 8px 0; border-bottom: 1px solid #F1F5F9;
        }
        .building-info-row:last-child { border-bottom: none; padding-bottom: 0; }
        .building-info-row-left {
            display: inline-flex; align-items: center; gap: 10px; min-width: 0;
        }
        .building-info-row-label { font-size: var(--text-body); color: #64748B; }
        .building-info-row-value {
            font-size: var(--text-body); font-weight: var(--font-semibold); color: #0F172A; text-align: right;
        }
        .building-notes-block {
            margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border-light);
        }
        .building-notes-block--compact { margin-top: 10px; padding-top: 10px; }
        .building-notes-label {
            font-size: 11px; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 4px;
        }
        .building-notes-text {
            font-size: var(--text-body); color: #475569; line-height: 1.45; margin: 0; white-space: pre-wrap;
        }
        .section-hint {
            font-size: 12px; color: #94A3B8; margin: -6px 0 10px; line-height: 1.4;
        }
        .feature-pick-section { background: #fff; }
        .feature-pick-title {
            font-size: 13px; font-weight: 800; color: #0F172A; margin: 0 0 4px;
        }
        .feature-pick-sub {
            font-size: 12px; color: #64748B; margin: 0 0 12px; line-height: 1.4;
        }
        .feature-pick-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
        }
        .feature-pick-chip {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 12px; border-radius: 12px;
            border: 1px solid var(--color-border); background: #fff;
            font-size: 12px; font-weight: 600; color: #475569;
            cursor: pointer; text-align: left; width: 100%;
        }
        .feature-pick-chip.is-active {
            border-color: #BFDBFE; background: #EFF6FF; color: #1D4ED8;
        }
        .feature-pick-chip-icon {
            width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
            background: #F8FAFC; border: 1px solid var(--color-border);
            display: inline-flex; align-items: center; justify-content: center; color: #64748B;
        }
        .feature-pick-chip.is-active .feature-pick-chip-icon {
            background: #fff; color: #2563EB; border-color: #BFDBFE;
        }
        .feature-pick-check { margin-left: auto; color: #2563EB; flex-shrink: 0; }
        .utility-provider-head {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
        }
        .utility-provider-title {
            font-size: 13px; font-weight: 700; color: #0F172A; margin: 0;
        }
        .building-icon-grid {
            display: grid; gap: 10px var(--gap-grid); margin-bottom: 4px;
        }
        .building-icon-grid.cols-2 { grid-template-columns: 1fr 1fr; }
        .building-icon-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .building-icon-item {
            display: inline-flex; align-items: center; gap: 8px;
            min-height: var(--size-icon-box);
            font-size: var(--text-caption); font-weight: var(--font-medium); color: #475569; min-width: 0;
        }
        .building-icon-item i { color: #94A3B8; flex-shrink: 0; }
        .building-flat-list { display: flex; flex-direction: column; gap: 8px; }
        .building-flat-row {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: var(--gap-grid); min-height: var(--size-list-row);
            border: none; cursor: pointer; text-align: left;
        }
        .building-flat-row:active { background: #F8FAFC; }
        .building-flat-main {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0;
        }
        .building-flat-badge {
            display: inline-flex; align-items: center; min-height: 28px;
            padding: 4px 10px; border-radius: var(--radius-full);
            font-size: var(--text-caption); font-weight: var(--font-semibold);
        }
        .building-flat-badge.is-occupied { background: #DCFCE7; color: #16A34A; }
        .building-flat-badge.is-vacant { background: #FEF3C7; color: #D97706; }
        .building-flat-tenant { font-size: var(--text-caption); color: #64748B; }
        .building-info-page .btn-secondary.w-full { min-height: var(--size-btn); }

        .ctr-stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
        }
        .ctr-job-card { padding: var(--card-pad); }
        .ctr-job-card-top { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .ctr-job-title { font-size: 14px; font-weight: 700; color: #0F172A; margin: 0; }
        .ctr-job-prop { font-size: 12px; font-weight: 600; color: #475569; margin: 4px 0 0; }
        .ctr-job-addr { font-size: 11px; color: #94A3B8; margin: 2px 0 0; }
        .ctr-job-meta {
            display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px;
            font-size: 11px; color: #64748B;
        }
        .ctr-job-meta span { display: inline-flex; align-items: center; gap: 4px; }
        .ctr-timeline {
            display: flex; flex-direction: column; gap: 0; padding: 4px 0 8px;
        }
        .ctr-timeline-step {
            display: flex; align-items: center; gap: 10px; padding: 6px 0; position: relative;
        }
        .ctr-timeline-step:not(:last-child)::after {
            content: ''; position: absolute; left: 5px; top: 22px; width: 2px; height: calc(100% - 6px);
            background: #E2E8F0;
        }
        .ctr-timeline-step.done:not(:last-child)::after { background: #86EFAC; }
        .ctr-timeline-dot {
            width: 12px; height: 12px; border-radius: 50%; background: #E2E8F0; flex-shrink: 0; z-index: 1;
        }
        .ctr-timeline-step.done .ctr-timeline-dot { background: #22C55E; }
        .ctr-timeline-step.active .ctr-timeline-dot { background: #2563EB; box-shadow: 0 0 0 3px #DBEAFE; }
        .ctr-timeline-label { font-size: 12px; color: #64748B; margin: 0; }
        .ctr-timeline-step.done .ctr-timeline-label { color: #0F172A; font-weight: 600; }
        .ctr-timeline-step.active .ctr-timeline-label { color: #2563EB; font-weight: 700; }

        .ctr-section-label {
            font-size: 12px; font-weight: 700; color: var(--color-text-muted);
            text-transform: uppercase; letter-spacing: .04em; margin: 0;
        }
        .ctr-photo-section { margin-bottom: 14px; }
        .ctr-photo-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0;
        }
        .ctr-photo-thumb {
            width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px;
            border: 1px solid var(--color-border);
        }

    <script>
    (function () {
        function showBootError(msg) {
            var app = document.getElementById('app');
            if (!app || app.innerHTML.trim()) return;
            app.className = 'app-preauth';
            app.innerHTML = '<div style="padding:32px 24px;font-family:Plus Jakarta Sans,system-ui,sans-serif;text-align:center">'
                + '<div style="width:56px;height:56px;border-radius:16px;background:#EFF6FF;color:#2563EB;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px">&#8962;</div>'
                + '<h1 style="font-size:20px;font-weight:700;color:#0F172A;margin:0 0 8px">Landlord HQ</h1>'
                + '<p style="font-size:14px;color:#64748B;line-height:1.5;margin:0 0 20px">' + msg + '</p>'
                + '<button type="button" onclick="location.reload()" style="background:#2563EB;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer">Reload app</button>'
                + '</div>';
        }
        window.addEventListener('error', function (e) {
            if (e.target && e.target.tagName === 'SCRIPT') {
                showBootError('A required file failed to load. Please refresh the page.');
            }
        }, true);
        setTimeout(function () {
            if (!document.getElementById('app') || !document.getElementById('app').innerHTML.trim()) {
                showBootError('The app is taking longer than expected to start. Please refresh or clear site data.');
            }
        }, 5000);
    })();
    </script>
